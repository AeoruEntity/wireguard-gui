[package]
name = "aeoru-nvr"
version = "0.1.0"
edition = "2021"
description = "Aeoru VPN - WireGuard VPN Client"
authors = ["AeoruEntity"]

[dependencies]
gtk = { version = "0.8", package = "gtk4", features = ["v4_10"] }
adw = { version = "0.6", package = "libadwaita", features = ["v1_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
